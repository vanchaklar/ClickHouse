name: PR 113506 recovery regression preflight

on:
  push:
    branches: ['ci/pr113506-optimized-recovery-tests-20260907']

permissions:
  contents: read

concurrency:
  group: pr113506-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install style dependencies
        run: |
          sudo apt-get update > style-setup.log 2>&1
          sudo apt-get install -y libxml2-utils ripgrep >> style-setup.log 2>&1
          python3 -m pip install -r ci/docker/style-test/requirements.txt >> style-setup.log 2>&1

      - name: Run repository style check
        run: |
          mkdir -p ci/tmp
          python3 ./ci/jobs/scripts/workflow_hooks/store_data.py > store-data.log 2>&1
          PYTHONPATH=./ci:. python3 ci/jobs/check_style.py > style.log 2>&1

      - name: Upload style logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr113506-style
          path: |
            style-setup.log
            store-data.log
            style.log
          retention-days: 7

  scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/tmp/pr113506-ccache
      CCACHE_MAXSIZE: 2G
      BASE_SHA: d3725cea24aa0f40908cefa07035b7822726bec6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare logs and preserve patched tests
        run: |
          mkdir -p build
          cp src/Common/Scheduler/Nodes/tests/gtest_space_shared_scheduler.cpp build/scheduler_tests_patched.cpp
          git fetch --depth=1 origin "$BASE_SHA" > build/fetch.log 2>&1
          git show "$BASE_SHA:src/Common/Scheduler/Nodes/tests/gtest_space_shared_scheduler.cpp" > src/Common/Scheduler/Nodes/tests/gtest_space_shared_scheduler.cpp

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-clang21-pr113506-ccache-recovery-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-clang21-pr113506-ccache-

      - name: Install tools and shallow dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo apt-get update > build/setup.log 2>&1
          sudo apt-get install -y ca-certificates ccache gnupg nasm ninja-build wget >> build/setup.log 2>&1
          wget -q https://apt.llvm.org/llvm-snapshot.gpg.key -O build/llvm-key.asc
          sudo cp build/llvm-key.asc /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update >> build/setup.log 2>&1
          sudo apt-get install -y clang-21 lld-21 >> build/setup.log 2>&1
          git submodule sync --recursive > build/submodules.log 2>&1
          git submodule update --init --recursive --depth 1 --jobs 8 >> build/submodules.log 2>&1

      - name: Add focused target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/CMakeLists.txt")
          path.write_text(path.read_text() + r"""
          if (ENABLE_TESTS)
              file(WRITE "${CMAKE_CURRENT_BINARY_DIR}/scheduler_gtest_main.cpp" [=[
          #include <gtest/gtest.h>
          #include <Columns/IColumn_fwd.h>
          #include <Common/ThreadStatus.h>
          #include <Processors/IProcessor.h>
          #include <Poco/ConsoleChannel.h>
          #include <Poco/Logger.h>

          namespace DB
          {
          void ThreadStatus::initGlobalProfiler(UInt64, UInt64) {}

          /// The focused runner deliberately does not link the complete processor library.
          /// These definitions are sufficient for the port-free spill probe used by the scheduler tests.
          IProcessor::IProcessor() = default;
          IProcessor::Status IProcessor::prepare() { return Status::Finished; }
          void IProcessor::work() {}
          int IProcessor::schedule() { return -1; }
          #if defined(OS_LINUX) || defined(OS_DARWIN)
          std::tuple<int, uint32_t, Int64> IProcessor::scheduleForEvent() { return {-1, 0, -1}; }
          #endif
          IProcessor::PipelineUpdate IProcessor::updatePipeline() { return {}; }
          void IProcessor::cancel(CancelReason) noexcept {}

          void intrusive_ptr_add_ref(const IColumn *) {}
          void intrusive_ptr_release(const IColumn *) {}
          }

          int main(int argc, char ** argv)
          {
              /// Surface assertion descriptions and traces from re-executed death-test children.
              Poco::Logger::root().setChannel(new Poco::ConsoleChannel);
              testing::InitGoogleTest(&argc, argv);
              return RUN_ALL_TESTS();
          }
          ]=])

              clickhouse_add_executable(
                  unit_test_space_shared_scheduler
                  Common/Scheduler/Nodes/tests/gtest_space_shared_scheduler.cpp
                  Core/Settings.cpp
                  "${CMAKE_CURRENT_BINARY_DIR}/scheduler_gtest_main.cpp"
              )
              target_compile_options(unit_test_space_shared_scheduler PRIVATE -Wno-sign-compare -Wno-header-hygiene)
              target_link_libraries(
                  unit_test_space_shared_scheduler PRIVATE
                  ch_contrib::gmock_all
                  ch_contrib::gtest
                  clickhouse_common_io
                  clickhouse_common_config
              )
          endif()
          """)
          PY


      - name: Configure and build baseline
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_LINKER=ld.lld-21 \
            -DPARALLEL_COMPILE_JOBS=2 -DPARALLEL_LINK_JOBS=1 \
            -DENABLE_TESTS=ON -DENABLE_EXAMPLES=OFF -DENABLE_BENCHMARKS=OFF \
            -DENABLE_UTILS=OFF -DENABLE_JEMALLOC=OFF -DENABLE_AWS_S3=OFF \
            -DENABLE_AZURE_BLOB_STORAGE=OFF -DENABLE_HDFS=OFF -DENABLE_KAFKA=OFF \
            -DENABLE_NATS=OFF -DENABLE_RABBITMQ=OFF -DENABLE_GRPC=OFF \
            -DFAIL_ON_UNSUPPORTED_OPTIONS_COMBINATION=OFF > build/configure.log 2>&1
          cmake --build build --target unit_test_space_shared_scheduler > build/build_baseline.log 2>&1

      - name: Reproduce baseline failures with bounded processes
        run: |
          set +e
          timeout --kill-after=5s 30s build/src/unit_test_space_shared_scheduler \
            --gtest_filter=SchedulerSpaceShared.UnprotectedGrowthDoesNotJoinProtectedRecoveryEpisode \
            --gtest_repeat=5 > build/test_baseline_pressure.log 2>&1
          pressure_result=$?
          timeout --kill-after=5s 30s build/src/unit_test_space_shared_scheduler \
            --gtest_filter=SchedulerSpaceShared.Smoke:SchedulerSpaceShared.DetachingLimitCancelsQueuedSuction \
            > build/test_baseline_detach.log 2>&1
          detach_result=$?
          timeout --kill-after=5s 30s build/src/unit_test_space_shared_scheduler \
            --gtest_filter=SchedulerSpaceShared.EvictionProtectionIsLastFallback \
            > build/test_baseline_eviction_order.log 2>&1
          eviction_result=$?
          timeout --kill-after=5s 30s build/src/unit_test_space_shared_scheduler \
            --gtest_death_test_style=threadsafe \
            --gtest_filter=SchedulerSpaceShared.SiblingLimitsSharePolicySuctionSlot \
            > build/test_baseline_sibling_precedence.log 2>&1
          sibling_result=$?
          set -e
          printf 'pressure_exit=%s\ndetach_exit=%s\neviction_exit=%s\nsibling_exit=%s\n' \
            "$pressure_result" "$detach_result" "$eviction_result" "$sibling_result" > build/baseline_results.txt

      - name: Build patched tests
        id: patched
        run: |
          cp build/scheduler_tests_patched.cpp src/Common/Scheduler/Nodes/tests/gtest_space_shared_scheduler.cpp
          cmake --build build --target unit_test_space_shared_scheduler > build/build_patched.log 2>&1

      - name: Run all scheduler cases independently
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys
          binary = "build/src/unit_test_space_shared_scheduler"
          listing = subprocess.run([binary, "--gtest_list_tests", "--gtest_filter=SchedulerSpaceShared.*"],
                                   check=True, capture_output=True, text=True)
          pathlib.Path("build/test_list.log").write_text(listing.stdout)
          tests = []
          suite = ""
          for line in listing.stdout.splitlines():
              if line.startswith("SchedulerSpaceShared."):
                  suite = line.strip()
              elif suite and line.startswith("  "):
                  tests.append(suite + line.strip().split()[0])
          if len(tests) != 73:
              raise RuntimeError(f"Expected 73 scheduler tests, found {len(tests)}")
          failed = []
          results = []
          for name in tests:
              with open(f"build/test_{name}.log", "w") as log:
                  result = subprocess.run(["timeout", "--kill-after=5s", "30s", binary,
                                           f"--gtest_filter={name}"], stdout=log, stderr=subprocess.STDOUT)
              results.append(f"{name}\t{result.returncode}")
              if result.returncode:
                  failed.append(name)
          pathlib.Path("build/test_results.tsv").write_text("\n".join(results) + "\n")
          print(f"Executed {len(tests)} tests; {len(failed)} failed")
          sys.exit(bool(failed))
          PY

      - name: Run scheduler suite together
        if: ${{ !cancelled() && steps.patched.outcome == 'success' }}
        run: |
          timeout --kill-after=5s 300s build/src/unit_test_space_shared_scheduler \
            --gtest_filter=SchedulerSpaceShared.* > build/test_suite.log 2>&1

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr113506-recovery-preflight
          path: |
            build/*.log
            build/*results.*
          retention-days: 7

name: Package pinned ExpoDecay CI artifacts

on:
  create:
  push:
    branches: [release/package-expodecay-cf2fd6eb-20261011-run]
    paths:
      - .github/workflows/package-expodecay.yml
      - .github/scripts/expodecay-package.py
      - .github/scripts/expodecay-publish.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-expodecay-cf2fd6eb-20261011
  cancel-in-progress: false

jobs:
  package-and-publish:
    if: github.repository == 'vanchaklar/ClickHouse' && github.ref == 'refs/heads/release/package-expodecay-cf2fd6eb-20261011-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/expodecay-package.py
            /.github/scripts/expodecay-publish.py
            /LICENSE
          fetch-depth: 1
      - name: Download pinned builds and verify compression round-trip
        run: python3 .github/scripts/expodecay-package.py
      - name: Preserve verified binaries independently of release access
        id: retained
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expodecay-26.10.1.1-cf2fd6eb-binaries
          path: tmp/expodecay-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Show downloadable artifact link
        env:
          ARTIFACT_URL: ${{ steps.retained.outputs.artifact-url }}
        run: printf '\nVerified binaries %s\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload only if the owner-created prerelease exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/expodecay-publish.py

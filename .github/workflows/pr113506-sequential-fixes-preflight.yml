name: PR 113506 test-object compile-only diagnostic

on:
  push:
    branches: ['ci/pr113506-combined-validation-v10-20260913']

permissions:
  contents: read

concurrency:
  group: pr113506-combined-v10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      STYLE_BASE_SHA: c18e0912052615f063a6ca0e6706150127ee20d3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install style dependencies
        run: |
          sudo apt-get update > style-setup.log 2>&1
          sudo apt-get install -y libxml2-utils ripgrep >> style-setup.log 2>&1
          python3 -m pip install -r ci/docker/style-test/requirements.txt >> style-setup.log 2>&1

      - name: Run repository style check
        run: |
          mkdir -p ci/tmp
          git fetch --depth=1 origin "$STYLE_BASE_SHA" > style-fetch.log 2>&1
          PYTHONPATH=./ci:. python3 ./ci/jobs/scripts/workflow_hooks/store_data.py > store-data.log 2>&1
          PYTHONPATH=./ci:. python3 - <<'PY' > style.log 2>&1
          import os
          import runpy
          import subprocess
          from pathlib import Path

          from ci.jobs.scripts.workflow_hooks.store_data import SETTINGS_HISTORY_FILE
          from ci.jobs.scripts.workflow_hooks.store_data import parse_settings_history_changes
          from ci.praktika.info import Info

          base = os.environ["STYLE_BASE_SHA"]
          changed_files = subprocess.run(
              ["git", "diff", "--name-only", base, "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          patch = subprocess.run(
              ["git", "diff", "--unified=0", base, "HEAD", "--", SETTINGS_HISTORY_FILE],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          file_lines = Path(SETTINGS_HISTORY_FILE).read_text().splitlines()

          info = Info()
          info.store_kv_data("changed_files", changed_files)
          info.store_kv_data(
              "settings_history_changed_settings",
              parse_settings_history_changes(patch, file_lines),
          )
          runpy.run_path("ci/jobs/check_style.py", run_name="__main__")
          PY

      - name: Print style failure diagnostics
        if: failure()
        run: |
          for log in style-fetch.log store-data.log style.log; do
            if test -f "$log"; then
              tail -n 180 "$log"
            fi
          done

      - name: Upload style logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr113506-style
          path: |
            style-setup.log
            style-fetch.log
            store-data.log
            style.log
          retention-days: 7

  scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/tmp/pr113506-ccache
      CCACHE_MAXSIZE: 2G
      BASE_SHA: c18e0912052615f063a6ca0e6706150127ee20d3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install tools and shallow dependencies
        run: |
          mkdir -p build
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo apt-get update > build/setup.log 2>&1
          sudo apt-get install -y ca-certificates ccache gnupg nasm ninja-build wget >> build/setup.log 2>&1
          wget -q https://apt.llvm.org/llvm-snapshot.gpg.key -O build/llvm-key.asc
          sudo cp build/llvm-key.asc /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update >> build/setup.log 2>&1
          sudo apt-get install -y clang-21 lld-21 >> build/setup.log 2>&1
          git submodule sync --recursive > build/submodules.log 2>&1
          git submodule update --init --recursive --depth 1 --jobs 8 >> build/submodules.log 2>&1

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-clang21-pr113506-ccache-recovery-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-clang21-pr113506-ccache-

      - name: Configure and compile exact production test objects
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_LINKER=ld.lld-21 \
            -DPARALLEL_COMPILE_JOBS=2 -DPARALLEL_LINK_JOBS=1 \
            -DENABLE_TESTS=ON -DENABLE_EXAMPLES=OFF -DENABLE_BENCHMARKS=OFF \
            -DENABLE_UTILS=OFF -DENABLE_JEMALLOC=OFF -DENABLE_AWS_S3=OFF \
            -DENABLE_AZURE_BLOB_STORAGE=OFF -DENABLE_HDFS=OFF -DENABLE_KAFKA=OFF \
            -DENABLE_NATS=OFF -DENABLE_RABBITMQ=OFF -DENABLE_GRPC=OFF \
            -DENABLE_PARQUET=OFF \
            -DFAIL_ON_UNSUPPORTED_OPTIONS_COMBINATION=OFF > build/configure.log 2>&1
          python3 - <<'PY_BUILD'
          import os
          import signal
          import subprocess
          import sys
          from pathlib import Path

          listing = subprocess.run(
              ["ninja", "-C", "build", "-t", "targets", "all"],
              check=True, capture_output=True, text=True,
          ).stdout
          Path("build/ninja_targets.log").write_text(listing)
          targets = []
          for source in ("gtest_space_shared_scheduler.cpp.o", "gtest_workload_resource_manager.cpp.o"):
              matches = [
                  line.split(":", 1)[0]
                  for line in listing.splitlines()
                  if line.split(":", 1)[0].endswith("/" + source)
              ]
              if len(matches) != 1:
                  raise RuntimeError(f"Expected one production target for {source}, found {matches}")
              targets.append(matches[0])
          Path("build/exact_test_targets.log").write_text("\n".join(targets) + "\n")

          with open("build/build_candidate.log", "w") as log:
              process = subprocess.Popen(
                  ["cmake", "--build", "build", "--target", *targets],
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  start_new_session=True,
              )
              try:
                  result = process.wait(timeout=30 * 60)
              except subprocess.TimeoutExpired:
                  print("Test-object compilation reached the 30-minute budget; stopping all build workers.", file=log, flush=True)
                  os.killpg(process.pid, signal.SIGTERM)
                  try:
                      process.wait(timeout=30)
                  except subprocess.TimeoutExpired:
                      pass
                  # The leader can exit while descendants still hold cache files.
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait()
                  result = 124
              if result == 0:
                  Path("build/compile_only_result.log").write_text(
                      "Both exact production test objects compiled.\n"
                      "COMPILE ONLY: no executable linked and no tests ran.\n"
                      "This result does not satisfy the PR publication gate.\n"
                  )
              sys.exit(result)
          PY_BUILD

      - name: Print build and test failure diagnostics
        if: failure()
        run: |
          for log in build/configure.log build/build_*.log build/test_baseline_*.log build/test_corrected_*.log build/test_suite.log build/test_results.tsv; do
            if test -f "$log"; then
              tail -n 100 "$log"
            fi
          done

      - name: Record and finalize compiler cache
        if: always()
        run: |
          ccache --show-stats > build/ccache_stats.log 2>&1
          ccache --cleanup >> build/ccache_stats.log 2>&1
          du -sk "$CCACHE_DIR" >> build/ccache_stats.log
          df -h . >> build/ccache_stats.log

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr113506-test-object-compile-only
          path: |
            build/*.log
            build/*results.*
          retention-days: 7

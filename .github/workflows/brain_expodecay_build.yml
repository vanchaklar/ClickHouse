name: Build ExpoDecay binaries

on:
  push:
    branches:
      - build/brain-expodecay-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-expodecay-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_BASE: 061f4e85dc82d510c05fda398e58945e4d031612
  BUILDER_IMAGE: clickhouse/binary-builder@sha256:965e941101765ee9d6e59f00bd83c268ae97a96c31beb4db8b0c58b8dc8bf570
  SOURCE_CACHE_KEY: 4d95074e308d0959

jobs:
  build:
    if: github.repository == 'vanchaklar/ClickHouse' && github.ref == 'refs/heads/build/brain-expodecay-2026-10-06'
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Reclaim disposable runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker system prune --all --force
          df -h
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: false
          persist-credentials: false
      - name: Restore pinned source archive
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-cache/source/${{ env.SOURCE_CACHE_KEY }}.tar.zst
          key: expodecay-source-v1-${{ env.SOURCE_CACHE_KEY }}-ce6f5b3471a830d4
      - name: Verify source cache and materialize pinned submodules
        timeout-minutes: 15
        run: |
          mkdir -p build-cache/source build-release
          exec >build-release/source-restore.log 2>&1
          archive="build-cache/source/${SOURCE_CACHE_KEY}.tar.zst"
          if [ ! -f "${archive}" ]; then
            curl --fail --silent --show-error --retry 3 --connect-timeout 30 --max-time 600 \
              "https://clickhouse-builds.s3.amazonaws.com/ci_ch_cache/submodules/${SOURCE_CACHE_KEY}.tar.zst" \
              --output "${archive}.partial"
            mv "${archive}.partial" "${archive}"
          fi
          python3 .github/scripts/brain-expodecay/restore_submodule_cache.py \
            --archive "${archive}" \
            --sha256 ce6f5b3471a830d478f4adf8ad5ece8d41b2ab285634a473810840cd85624321 \
            --cache-key "${SOURCE_CACHE_KEY}" --repo . \
            --report build-release/source-cache.json
          GIT_ALLOW_PROTOCOL= GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            git -c core.hooksPath=/dev/null -c protocol.allow=never \
            submodule update --init --no-fetch --jobs 4
          git -c core.hooksPath=/dev/null submodule status --recursive >build-release/submodules.txt
          if grep -Eq '^[+-U]' build-release/submodules.txt; then
            echo "Uninitialized, divergent, or conflicted submodules" >&2
            exit 1
          fi
      - name: Save verified source archive
        if: matrix.arch == 'x86_64' && steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-cache/source/${{ env.SOURCE_CACHE_KEY }}.tar.zst
          key: ${{ steps.source-cache.outputs.cache-primary-key }}
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-cache/sccache
          key: expodecay-sccache-v1-${{ matrix.arch }}-965e941101765ee9-${{ env.SOURCE_BASE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            expodecay-sccache-v1-${{ matrix.arch }}-965e941101765ee9-${{ env.SOURCE_BASE }}-
            expodecay-sccache-v1-${{ matrix.arch }}-965e941101765ee9-
      - name: Verify isolated source and build
        timeout-minutes: 330
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash .github/scripts/brain-expodecay/build.sh
      - name: Upload unvalidated build for native testing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-linux-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_id }}
          overwrite: true
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Prepare compiler cache for saving
        id: cache-ready
        if: always()
        run: |
          if [ -d build-cache/sccache ]; then
            sudo chown -R "$(id -u):$(id -g)" build-cache/sccache
            echo "available=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Save completed compiler work
        if: always() && steps.cache-ready.outputs.available == 'true' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-cache/sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-logs-linux-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build-release/*.log
            build-release/*.txt
            build-release/*.json
          if-no-files-found: warn
          retention-days: 14

  smoke:
    needs: build
    if: always() && !cancelled() && github.repository == 'vanchaklar/ClickHouse' && github.ref == 'refs/heads/build/brain-expodecay-2026-10-06'
    name: Native smoke Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out validation scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/brain-expodecay
      - name: Download this run's candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: candidate-linux-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_id }}
          path: dist
      - name: Verify source, checksums, and native behavior
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash .github/scripts/brain-expodecay/validate.sh
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: smoke-logs-linux-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build-native-smoke/*.log
            build-native-smoke/*.json
            build-native-smoke/*.txt
            build-native-smoke/*.sql
          if-no-files-found: warn
          retention-days: 14
      - name: Upload natively validated binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clickhouse-expodecay-linux-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            build-native-smoke/validation.json
            build-native-smoke/smoke-summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
